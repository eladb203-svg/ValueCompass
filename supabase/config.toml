# Auth settings for ValueCompass (security stage, spec 1). Applied to a hosted project with:  supabase config push --project-ref <ref>
# (the CLI is not installed on this PC yet; the same settings are listed step by step in scripts/code_stage_security_2026-11-01.md)
project_id = "valuecompass"

[auth]
site_url = "http://localhost:3000"
# "Allow new users to sign up" stays OFF in both registration modes (spec 1.1, update 2026-11-01): an account is created only from an invitation.
# The sign-up form calls the signup-request function, which saves a request; the admin's approval sends the invitation (admin-tickets -> invite).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true            # the email provider itself stays on (invited users set their password); the global enable_signup above blocks self-sign-up
enable_confirmations = true     # email verification is required
double_confirm_changes = true
secure_password_change = true

[auth.email.template.invite]
subject = "הוזמנת להצטרף ל-ValueCompass"
content_path = "./templates/invite.html"

[auth.email.template.recovery]
subject = "איפוס סיסמה ל-ValueCompass"
content_path = "./templates/recovery.html"

[auth.email.template.confirmation]
subject = "אימות כתובת המייל ב-ValueCompass"
content_path = "./templates/confirmation.html"
