# Approval rule 3 (AI skills 2026-10-27_09-10, 2.3): for an extracted item, the row label of its quote must contain one of these phrases (lower case; a phrase matches inside the label).
# An item without a list here is judged by rule 6 only. Sources: the Rulebook Part E dictionary (item names), src/etl/field_map.py (engine fields and their tags), the extraction CSV files
